<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="468" viewBox="0 0 1420 468" role="img" aria-labelledby="title description"><title id="title">BatchQuay native execution storyboard</title><desc id="description">A visual summary of an actual recorded C++ child-process trace using synthetic random weights. Two accepted requests, one capacity denial, interleaved prefill, beta cancellation, alpha decoding and zero final live, reserved and physical pages.</desc><defs><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#32536A" stroke-opacity=".25" stroke-width=".9"/></pattern><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75EACB" stop-opacity=".095"/><stop offset="1" stop-color="#9BBEFF" stop-opacity="0"/></linearGradient></defs><rect width="1420" height="468" rx="26" fill="#081B29"/><rect width="1420" height="468" rx="26" fill="url(#grid)"/><circle cx="1490" cy="-65" r="380" fill="url(#glow)"/><rect x="0" y="0" width="1420" height="5" rx="3" fill="#75EACB"/><rect x="40" y="36" width="9" height="9" rx="2" fill="#75EACB"/><text x="60" y="47" fill="#B4C9D5" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.3">BATCHQUAY  /  FLIGHT RECORDER</text><rect x="1073" y="25" width="307" height="39" rx="20" fill="#173549" stroke="#32536A"/><text x="1226" y="51" fill="#B4C9D5" font-size="15" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">SYNTHETIC  ·  SEED 1729</text><text x="40" y="122" fill="#F1F8FA" font-size="49" font-weight="780" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="-1.8">Every request has an ending.</text><text x="42" y="166" fill="#B4C9D5" font-size="21" font-weight="400" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">One native execution  ·  six observable transitions  ·  no hidden happy path</text><path d="M42 