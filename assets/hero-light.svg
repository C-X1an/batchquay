<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 420" width="1360" height="420" role="img" aria-labelledby="title desc">
<title id="title">BatchQuay — inspect the math, bound the state, explain the result</title>
<desc id="desc">A stylized schematic of incoming requests flowing through one bounded actor, emitting token and terminal events with separately owned key/value pages that are allocated and reclaimed. Illustration, not a benchmark or screenshot.</desc>
